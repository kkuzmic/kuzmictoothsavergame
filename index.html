function resize(){
  const r=canvas.getBoundingClientRect();
  W=Math.max(320,r.width); H=Math.max(240,r.height);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  scale=dpr;
  tooth.y=H-92;
}
addEventListener("resize",resize); resize();

function X(v){return v*scale}
function Y(v){return v*scale}
function S(v){return v*scale}
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height)}

function roundedRect(x,y,w,h,r,fill,stroke,lw=1){
  r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
}

function panel(x,y,w,h){
  roundedRect(X(x),Y(y),S(w),S(h),S(18),"rgba(4,31,86,.82)","rgba(48,190,255,.85)",S(2));
}

function text(t,x,y,size,fill="#fff",weight="700",align="center"){
  ctx.font=`${weight} ${S(size)}px Arial`;ctx.fillStyle=fill;ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(t,X(x),Y(y));
}

function drawSky(){
  const g=ctx.createLinearGradient(0,Y(0),0,Y(H));
  g.addColorStop(0,"#03236b");g.addColorStop(.52,"#0877d8");g.addColorStop(1,"#12b6ed");
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  // stars
  for(let i=0;i<Math.max(85,Math.ceil(W/12));i++){
    const x=(i*137)%W,y=(i*83)%Math.min(H*.8,570);
    ctx.fillStyle=i%7===0?"#fff":"rgba(190,235,255,.65)";
    ctx.beginPath();ctx.arc(X(x),Y(y),S(i%7===0?1.8:.8),0,Math.PI*2);ctx.fill();
  }
  // clouds spread across the full width
  const cloudCount=Math.max(4,Math.ceil(W/300));
  for(let i=0;i<cloudCount;i++){
    const x=(i*283+45)%(W+180)-90;
    const y=150+(i*97)%300;
    const sc=.72+(i%3)*.16;
    ctx.fillStyle="rgba(195,239,255,.62)";
    for(let j=0;j<5;j++){
      ctx.beginPath();ctx.arc(X(x+j*24),Y(y-(j%2)*10),S(23*sc),0,Math.PI*2);ctx.fill();
    }
  }
  // skyline extends all the way across the available screen
  const base=H-60;
  const step=38;
  const count=Math.ceil(W/step)+3;
  for(let i=0;i<count;i++){
    const bw=24+(i*17)%35,bh=45+(i*53)%180,x=i*step-8;
    ctx.fillStyle=i%3===0?"#063c91":"#0751a7";
    ctx.fillRect(X(x),Y(base-bh),S(bw),S(bh+60));
    for(let wy=base-bh+15;wy<base-5;wy+=18){
      for(let wx=x+7;wx<x+bw-4;wx+=13){
        if((wx+wy+i)%3!==0){ctx.fillStyle="rgba(255,220,86,.65)";ctx.fillRect(X(wx),Y(wy),S(5),S(7))}
      }
    }
  }
  ctx.fillStyle="#042d79";ctx.fillRect(0,Y(base),canvas.width,S(60));
  ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(0,Y(base),canvas.width,S(3));
}
function trail(){ /* intentionally removed for a cleaner arcade look */ }

function drawTooth(){
  const x=tooth.x,y=tooth.y;
  ctx.save();
  const w=tooth.w,h=tooth.h;
  // Supplied braces-tooth artwork, converted to smooth white anti-aliased line art.
  if(toothArt.complete){
    ctx.shadowColor="rgba(0,0,0,.22)";ctx.shadowBlur=S(5);ctx.shadowOffsetY=S(3);
    ctx.drawImage(toothArt,X(x-w/2),Y(y-h/2),S(w),S(h));
  }
  ctx.restore();
}
function drawBrush(x,y,s,r){
  ctx.save();
  ctx.translate(X(x),Y(y));
  ctx.rotate(r);
  // Use the supplied toothbrush reference as the collectible artwork.
  // The background has been removed and the edges are softly anti-aliased.
  if(brushArt.complete){
    const bw=72, bh=130;
    ctx.shadowColor="rgba(0,25,70,.28)";ctx.shadowBlur=7;ctx.shadowOffsetY=4;
    ctx.drawImage(brushArt,X(-bw*s/2),Y(-bh*s/2),S(bw*s),S(bh*s));
  }
  ctx.restore();
}
function drawFloss(x,y,s,r){
  ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(r);ctx.scale(scale*s,scale*s);
  ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  // recognizable floss container
  ctx.fillStyle="#f9fbff";ctx.strokeStyle="#aebdd0";ctx.lineWidth=2;
  roundedRect(-31,-36,62,72,12);ctx.fill();ctx.stroke();
  ctx.fillStyle="#e9f2ff";roundedRect(-24,-29,48,18,7);ctx.fill();
  ctx.fillStyle="#1762c9";roundedRect(-23,-5,46,25,6);ctx.fill();
  ctx.fillStyle="#ffffff";ctx.font="900 13px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("FLOSS",0,8);
  // little pull tab / floss cutter
  ctx.fillStyle="#d6e0ec";ctx.beginPath();ctx.moveTo(14,-36);ctx.lineTo(27,-27);ctx.lineTo(18,-20);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.restore();
}
function drawCandy(x,y,s,r){
  ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(r);ctx.scale(scale,scale);
  ctx.shadowColor="#ff3e98";ctx.shadowBlur=10;
  ctx.fillStyle="#ff2f79";ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff74a9";ctx.beginPath();ctx.arc(-5,-6,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff3f87";ctx.beginPath();ctx.moveTo(-21,-4);ctx.lineTo(-40,-16);ctx.lineTo(-34,0);ctx.lineTo(-40,16);ctx.lineTo(-20,5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(21,-4);ctx.lineTo(40,-16);ctx.lineTo(34,0);ctx.lineTo(40,16);ctx.lineTo(20,5);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawSoda(x,y,s,r){
  ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(r);ctx.scale(scale*s,scale*s);
  ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  // soda can
  ctx.fillStyle="#e32632";ctx.strokeStyle="#a91822";ctx.lineWidth=2;
  roundedRect(-24,-34,48,68,9);ctx.fill();ctx.stroke();
  ctx.fillStyle="#f4f4f4";ctx.beginPath();ctx.ellipse(0,-34,24,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#ffffff";ctx.font="900 16px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("SODA",0,4);
  ctx.strokeStyle="#f5f5f5";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(4,-36);ctx.lineTo(10,-61);ctx.stroke();
  ctx.strokeStyle="#e32632";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,-48);ctx.lineTo(11,-58);ctx.stroke();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.restore();
}
function drawItem(it){
  if(it.type==="brush")drawBrush(it.x,it.y,it.size,it.rot);
  if(it.type==="floss")drawFloss(it.x,it.y,it.size,it.rot);
  if(it.type==="badCandy")drawCandy(it.x,it.y,it.size,it.rot);
  if(it.type==="badSoda")drawSoda(it.x,it.y,it.size,it.rot);
}

function spawn(){
  const bad=Math.random()<Math.min(.20+level*.028,.48);
  const floss=!bad && Math.random()<.20;
  const type=bad?(Math.random()<.5?"badCandy":"badSoda"):(floss?"floss":"brush");

  // Pick a starting lane with horizontal separation from anything still near the top.
  let x=75+Math.random()*Math.max(1,W-150);
  for(let tries=0;tries<12;tries++){
    const candidate=75+Math.random()*Math.max(1,W-150);
    const crowded=items.some(it=>it.y<145 && Math.abs(it.x-candidate)<115);
    if(!crowded){x=candidate;break;}
  }

  const brushSpeed=180+Math.random()*95+level*28;
  const flossSpeed=265+Math.random()*85+level*32;
  const badSpeed=175+Math.random()*90+level*26;
  items.push({
    type,x,y:-75,
    size:type==="brush"?1.18:type==="floss"?1.06:1.06,
    vy:type==="floss"?flossSpeed:(bad?badSpeed:brushSpeed),
    rot:(Math.random()-.5)*.7,spin:(Math.random()-.5)*1.6
  });
}
function hit(it){
  const dx=it.x-tooth.x,dy=it.y-tooth.y;
  return Math.abs(dx)<58 && Math.abs(dy)<68;
}
function burst(x,y,good){
  for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.8)*180,life:1,good});
}
function update(dt){
  level=Math.min(10,1+Math.floor(score/150));
  const speed=620 + level*18;
  if(keys.ArrowLeft||keys.a)tooth.targetX-=speed*dt;
  if(keys.ArrowRight||keys.d)tooth.targetX+=speed*dt;
  tooth.targetX=Math.max(65,Math.min(W-65,tooth.targetX));
  tooth.x+=(tooth.targetX-tooth.x)*Math.min(1,dt*12);
  spawnClock+=dt;
  // Difficulty ramps substantially: more objects, shorter spawn gaps, and faster falls.
  const interval=Math.max(.28,1.08-level*.085);
  const maxItems=Math.min(9,3+Math.floor(level*.65));
  // Never release objects nearly on top of one another at the ceiling.
  const ceilingBusy=items.some(it=>it.y<95);
  if(spawnClock>interval && items.length<maxItems && !ceilingBusy){
    spawnClock=0;
    spawn();
  }
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=it.vy*dt;it.rot+=it.spin*dt;
    if(hit(it)){
      const good=it.type==="brush"||it.type==="floss";
      if(good){
        const pts=it.type==="floss"?30:10;score+=pts;
        burst(it.x,it.y,true);popText(it.x,it.y,`+${pts}`);
      }else{
        const pts=it.type==="badCandy"?-15:-20;score=Math.max(0,score+pts);
        lives--;burst(it.x,it.y,false);popText(it.x,it.y,`${pts}`);
        shake=10;
        if(lives<=0){best=Math.max(best,score);state="gameover"}
      }
      items.splice(i,1);continue;
    }
    if(it.y>H+80){
      if(it.type==="brush"||it.type==="floss"){lives--;popText(it.x,H-110,"MISSED!");shake=6;
        if(lives<=0){best=Math.max(best,score);state="gameover"}}
      items.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  shake*=.86;
}
function popText(x,y,t){particles.push({x,y,vx:0,vy:-55,life:1.0,text:t,textLife:true,good:t[0]==="+"})}

function legend(label,pts,color,y){
  ctx.save();
  const x=W-178;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(X(x),Y(y),S(8),0,Math.PI*2);
  ctx.fill();
  text(label,x+18,y,15,"#fff","800","left");
  text((pts>0?"+":"")+pts,x+140,y,15,color,"900","right");
  ctx.restore();
}

function hud(){
  panel(18,18,205,125);text("SCORE",120,43,25);text(String(score),120,82,54);
  text("BEST: "+best,120,114,18,"#ffd42a","800");
  panel(W/2-145,18,290,48);text("LEVEL "+level,W/2,42,25);
  for(let i=0;i<3;i++) text(i<lives?"❤":"♡",W/2-36+i*36,88,34,i<lives?"#ff4057":"#18375f");
  if(W>760){
    panel(W-195,95,177,300);text("POINTS",W-106,122,17,"#8deeff");
    legend("BRUSH",10,"#48bfff",160);legend("FLOSS",30,"#45ef86",220);
    legend("CANDY",-15,"#ff6b83",280);legend("SODA",-20,"#ff6b83",340);
  }
  if(logo.complete){
    // Small, proportional white logo inside the navy bottom band, lower-left.
    const bandH=60;
    const lw=Math.min(105,W*.14);
    const lh=lw*(730/1563);
    ctx.save();
    ctx.filter="brightness(0) invert(1)";
    ctx.shadowColor="rgba(0,0,0,.50)";ctx.shadowBlur=S(4);
    ctx.drawImage(logo,X(18),Y(H-bandH+(bandH-lh)/2),S(lw),S(lh));
    ctx.restore();
  }
}
function arrows(){
  const left=Math.max(100,W*.40),right=Math.min(W-100,W*.60);
  for(const a of [{x:left,t:"‹"},{x:right,t:"›"}]){
    roundedRect(X(a.x-46),Y(H-74),S(92),S(58),S(16),"rgba(15,93,170,.72)","rgba(170,240,255,.75)",S(2));
    text(a.t,a.x,H-44,46,"#fff","400");
  }
}
function render(){
  clear();drawSky();
  ctx.save();
  if(shake>1)ctx.translate((Math.random()-.5)*S(shake),(Math.random()-.5)*S(shake));
  items.forEach(drawItem);drawTooth();
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.textLife)text(p.text,p.x,p.y,21,p.good?"#74ff9d":"#ff6c79","900");
    else{ctx.fillStyle=p.good?"#fff27a":"#ff5d75";ctx.beginPath();ctx.arc(X(p.x),Y(p.y),S(3.5),0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
  }
  ctx.restore();hud();arrows();
  if(state==="menu"||state==="gameover"||paused){
    ctx.fillStyle="rgba(0,15,55,.62)";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(state==="menu"){text("TOOTH SAVER",W/2,235,55);text("Catch toothbrushes & floss • Avoid candy & soda",W/2,280,20,"#dffbff","700");button("START GAME",W/2,355)}
    if(state==="gameover"){text("GAME OVER",W/2,245,58);text("Score: "+score,W/2,295,28);button("PLAY AGAIN",W/2,355)}
    if(paused&&state==="playing"){text("PAUSED",W/2,285,52);button("RESUME",W/2,355)}
  }
}
function button(t,x,y){
  roundedRect(X(x-110),Y(y-28),S(220),S(56),S(18),"#0d5dcc","#7be8ff",S(3));
  text(t,x,y,22);
}
function loop(now){
  const dt=Math.min(.035,(now-last)/1000||0);last=now;
  if(state==="playing"&&!paused)update(dt);
  render();requestAnimationFrame(loop);
}
function start(){score=0;lives=3;level=1;items=[];particles=[];spawnClock=0;tooth.x=tooth.targetX=W/2;tooth.y=H-82;state="playing";paused=false}
function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/(r.width)),y:(e.clientY-r.top)*(H/(r.height))};
}
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture?.(e.pointerId);
  const p=canvasPoint(e);
  if(state==="menu"){start();return}
  if(state==="gameover"){start();return}
  if(state==="playing"){
    if(p.x>1020&&p.y<85){paused=!paused;return}
    if(paused){if(p.x>440&&p.x<660&&p.y>320&&p.y<390)paused=false;return}
    tooth.targetX=Math.max(65,Math.min(W-65,p.x));
  }
});
canvas.addEventListener("pointermove",e=>{
  if(state==="playing"&&!paused) tooth.targetX=Math.max(55,Math.min(W-55,canvasPoint(e).x));
});
addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key===" "){if(state==="menu"||state==="gameover")start();else if(state==="playing")paused=!paused}
  if(e.key==="Escape"&&state==="playing")paused=!paused;
});
addEventListener("keyup",e=>keys[e.key]=false);
loop(performance.now());
</script>
