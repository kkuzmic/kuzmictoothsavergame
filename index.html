function resize(){
  const r=canvas.getBoundingClientRect();
  W=Math.max(320,r.width); H=Math.max(240,r.height);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  scale=dpr;
  tooth.y=H-68;
}
addEventListener("resize",resize); resize();

function X(v){return v*scale}
function Y(v){return v*scale}
function S(v){return v*scale}
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height)}

function roundedRect(x,y,w,h,r,fill,stroke,lw=1){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
}

function panel(x,y,w,h){
  roundedRect(X(x),Y(y),S(w),S(h),S(18),"rgba(4,31,86,.82)","rgba(48,190,255,.85)",S(2));
}

function text(t,x,y,size,fill="#fff",weight="700",align="center"){
  ctx.font=`${weight} ${S(size)}px Arial`;ctx.fillStyle=fill;ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(t,X(x),Y(y));
}

function drawSky(){
  const g=ctx.createLinearGradient(0,Y(0),0,Y(H));
  g.addColorStop(0,"#03236b");g.addColorStop(.52,"#0877d8");g.addColorStop(1,"#12b6ed");
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  // stars
  for(let i=0;i<85;i++){
    const x=(i*137)%W,y=(i*83)%570;
    ctx.fillStyle=i%7===0?"#fff":"rgba(190,235,255,.65)";
    ctx.beginPath();ctx.arc(X(x),Y(y),S(i%7===0?1.8:.8),0,Math.PI*2);ctx.fill();
  }
  // clouds
  for(const c of [[45,310,1],[1020,350,1.15],[170,455,.8]]){
    ctx.fillStyle="rgba(195,239,255,.65)";
    for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(X(c[0]+j*25),Y(c[1]-(j%2)*12),S(24*c[2]),0,Math.PI*2);ctx.fill()}
  }
  // skyline
  const base=H-60;
  for(let i=0;i<31;i++){
    const bw=24+(i*17)%35,bh=45+(i*53)%180,x=i*38-8;
    ctx.fillStyle=i%3===0?"#063c91":"#0751a7";
    ctx.fillRect(X(x),Y(base-bh),S(bw),S(bh+60));
    for(let wy=base-bh+15;wy<base-5;wy+=18){
      for(let wx=x+7;wx<x+bw-4;wx+=13){
        if((wx+wy+i)%3!==0){ctx.fillStyle="rgba(255,220,86,.65)";ctx.fillRect(X(wx),Y(wy),S(5),S(7))}
      }
    }
  }
  ctx.fillStyle="#042d79";ctx.fillRect(0,Y(base),canvas.clientWidth,S(60));
  ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(0,Y(base),canvas.clientWidth,S(3));
}

function trail(x,y,color){
  const grad=ctx.createLinearGradient(X(x),Y(y-160),X(x),Y(y+10));
  grad.addColorStop(0,"rgba(255,255,255,0)");
  grad.addColorStop(.55,color);
  grad.addColorStop(1,"rgba(255,255,255,.05)");
  ctx.fillStyle=grad;ctx.fillRect(X(x-10),Y(y-160),S(20),S(170));
  for(let k=0;k<4;k++){
    ctx.fillStyle=color.replace("1)","0.18)");
    ctx.fillRect(X(x-24+k*12),Y(y-130),S(4),S(135));
  }
}

function drawTooth(){
  const x=tooth.x,y=tooth.y;
  ctx.save();ctx.translate(X(x),Y(y));
  const sc=Math.min(1,Math.max(.72,W/1100));ctx.scale(sc,sc);
  const rg=ctx.createRadialGradient(0,0,0,0,0,S(72));
  rg.addColorStop(0,"rgba(105,255,255,.45)");rg.addColorStop(1,"rgba(50,210,255,0)");
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,S(72),0,Math.PI*2);ctx.fill();
  ctx.shadowColor="#bafcff";ctx.shadowBlur=S(12);
  ctx.fillStyle="#fff";ctx.strokeStyle="#79dfff";ctx.lineWidth=S(2.5);
  ctx.beginPath();ctx.moveTo(0,-38);ctx.bezierCurveTo(-20,-52,-43,-44,-43,-20);
  ctx.bezierCurveTo(-43,3,-34,18,-27,39);ctx.bezierCurveTo(-22,53,-13,51,-7,37);
  ctx.bezierCurveTo(-3,28,3,28,7,37);ctx.bezierCurveTo(13,51,22,53,27,39);
  ctx.bezierCurveTo(34,18,43,3,43,-20);ctx.bezierCurveTo(43,-44,20,-52,0,-38);
  ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle="#17233c";ctx.beginPath();ctx.arc(-15,-14,S(6),0,Math.PI*2);ctx.arc(15,-14,S(6),0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-13,-16,S(2),0,Math.PI*2);ctx.arc(17,-16,S(2),0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#17233c";ctx.lineWidth=S(2.5);ctx.beginPath();ctx.arc(0,5,S(12),.15,Math.PI-.15);ctx.stroke();
  ctx.fillStyle="#ff9ab1";ctx.beginPath();ctx.ellipse(-25,5,S(7),S(4),0,0,Math.PI*2);ctx.ellipse(25,5,S(7),S(4),0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawBrush(x,y,s,r){
  ctx.save();
  ctx.translate(X(x),Y(y));
  ctx.rotate(r);
  ctx.scale(scale,scale);
  const bw=92*s, bh=125*s;
  ctx.shadowColor="rgba(80,230,255,.42)";
  ctx.shadowBlur=8;
  if(brushArt.complete && brushArt.naturalWidth){
    ctx.drawImage(brushArt,-bw/2,-bh/2,bw,bh);
  }
  ctx.restore();
}

function drawFloss(x,y,s,r){
  ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(r);ctx.scale(scale,scale);
  ctx.shadowColor="rgba(80,230,255,.7)";ctx.shadowBlur=10;
  ctx.fillStyle="#fafafa";ctx.strokeStyle="#c9d5e5";ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(-30,-34,60,68,10);ctx.fill();ctx.stroke();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(-25,-34);ctx.lineTo(20,-34);ctx.lineTo(30,-23);ctx.lineTo(-18,-23);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle="#1d5ec7";ctx.beginPath();ctx.roundRect(-20,-5,40,23,5);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("FLOSS",0,7);
  ctx.restore();
}

function drawCandy(x,y,s,r){
  ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(r);ctx.scale(scale,scale);
  ctx.shadowColor="#ff3e98";ctx.shadowBlur=10;
  ctx.fillStyle="#ff2f79";ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff74a9";ctx.beginPath();ctx.arc(-5,-6,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff3f87";ctx.beginPath();ctx.moveTo(-21,-4);ctx.lineTo(-40,-16);ctx.lineTo(-34,0);ctx.lineTo(-40,16);ctx.lineTo(-20,5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(21,-4);ctx.lineTo(40,-16);ctx.lineTo(34,0);ctx.lineTo(40,16);ctx.lineTo(20,5);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawSoda(x,y,s,r){
  ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(r);ctx.scale(scale,scale);
  ctx.shadowColor="#ff3c49";ctx.shadowBlur=10;
  ctx.fillStyle="#e7272d";ctx.beginPath();ctx.roundRect(-25,-30,50,70,10);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(-25,-2);ctx.quadraticCurveTo(0,12,25,-2);ctx.lineWidth=7;ctx.strokeStyle="#fff";ctx.stroke();
  ctx.fillStyle="#e7e7e7";ctx.beginPath();ctx.ellipse(0,-30,25,8,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#f5f5f5";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(4,-34);ctx.lineTo(10,-58);ctx.stroke();
  ctx.strokeStyle="#e73333";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,-45);ctx.lineTo(11,-55);ctx.stroke();
  ctx.restore();
}

function drawItem(it){
  trail(it.x,it.y,it.type==="badCandy"||it.type==="badSoda"?"rgba(255,70,180,1)":"rgba(70,225,255,1)");
  if(it.type==="brush")drawBrush(it.x,it.y,it.size,it.rot);
  if(it.type==="floss")drawFloss(it.x,it.y,it.size,it.rot);
  if(it.type==="badCandy")drawCandy(it.x,it.y,it.size,it.rot);
  if(it.type==="badSoda")drawSoda(it.x,it.y,it.size,it.rot);
}

function spawn(){
  const bad=Math.random()<Math.min(.22+level*.025,.43);
  const floss=!bad && Math.random()<.20;
  const type=bad?(Math.random()<.5?"badCandy":"badSoda"):(floss?"floss":"brush");
  items.push({
    type,x:55+Math.random()*Math.max(1,W-110),y:-65,
    size:type==="brush"?1.15:type==="floss"?1.0:1.0,
    vy:type==="floss"?245+Math.random()*65+level*18:155+Math.random()*85+level*18,
    rot:(Math.random()-.5)*.7,spin:(Math.random()-.5)*1.6
  });
}

function hit(it){
  const dx=it.x-tooth.x,dy=it.y-tooth.y;
  return Math.abs(dx)<48 && Math.abs(dy)<55;
}
function burst(x,y,good){
  for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.8)*180,life:1,good});
}
function update(dt){
  level=1+Math.floor(score/150);
  const speed=560;
  if(keys.ArrowLeft||keys.a)tooth.targetX-=speed*dt;
  if(keys.ArrowRight||keys.d)tooth.targetX+=speed*dt;
  tooth.targetX=Math.max(65,Math.min(W-65,tooth.targetX));
  tooth.x+=(tooth.targetX-tooth.x)*Math.min(1,dt*12);
  spawnClock+=dt;
  const interval=Math.max(.82,.98-level*.018);
  if(spawnClock>interval && items.length<5){spawnClock=0;spawn()}
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=it.vy*dt;it.rot+=it.spin*dt;
    if(hit(it)){
      const good=it.type==="brush"||it.type==="floss";
      if(good){
        const pts=it.type==="floss"?30:10;score+=pts;
        burst(it.x,it.y,true);popText(it.x,it.y,`+${pts}`);
      }else{
        const pts=it.type==="badCandy"?-15:-20;score=Math.max(0,score+pts);
        lives--;burst(it.x,it.y,false);popText(it.x,it.y,`${pts}`);
        shake=10;
        if(lives<=0){best=Math.max(best,score);state="gameover"}
      }
      items.splice(i,1);continue;
    }
    if(it.y>H+80){
      if(it.type==="brush"||it.type==="floss"){lives--;popText(it.x,H-110,"MISSED!");shake=6;
        if(lives<=0){best=Math.max(best,score);state="gameover"}}
      items.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  shake*=.86;
}
function popText(x,y,t){particles.push({x,y,vx:0,vy:-55,life:1.0,text:t,textLife:true,good:t[0]==="+"})}

function hud(){
  panel(18,18,205,125);text("SCORE",120,43,25);text(String(score),120,82,54);
  text("BEST: "+best,120,114,18,"#ffd42a","800");
  panel(W/2-145,18,290,48);text("LEVEL "+level,W/2,42,25);
  for(let i=0;i<3;i++) text(i<lives?"❤":"♡",W/2+75+i*42,84,37,i<lives?"#ff4057":"#18375f");
  if(W>760){
    // Clean upper-right brand mark, positioned above the points panel.
    if(logo.complete){
      const lw=Math.min(180,W*.18),lh=lw*.467;
      const lx=18, ly=H-82;
      ctx.save();
      ctx.globalCompositeOperation="source-over";
      ctx.drawImage(logo,X(lx),Y(ly),S(lw),S(lh));
      // Convert the logo to clean white while preserving transparency.
      ctx.globalCompositeOperation="source-in";
      ctx.fillStyle="#fff";
      ctx.fillRect(X(lx),Y(ly),S(lw),S(lh));
      ctx.restore();
    }
    panel(W-195,95,177,300);text("TO CATCH",W-106,122,17,"#8deeff");
    legend("FLOSS",30,"#45ef86",160);legend("BRUSH",10,"#48bfff",220);
    legend("CANDY",-15,"#ff6b83",280);legend("SODA",-20,"#ff6b83",340);
  }
}
function legend(label,pts,color,y){
  // Compact points legend used by the right-side HUD.
  ctx.save();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(X(W-174),Y(y-5),S(8),0,Math.PI*2);
  ctx.fill();
  text(label,W-145,y,16,"#fff","800","left");
  text((pts>0?"+":"")+pts,W-35,y,16,color,"900","right");
  ctx.restore();
}
function arrows(){
  const left=Math.max(100,W*.40),right=Math.min(W-100,W*.60);
  for(const a of [{x:left,t:"‹"},{x:right,t:"›"}]){
    roundedRect(X(a.x-46),Y(H-74),S(92),S(58),S(16),"rgba(15,93,170,.72)","rgba(170,240,255,.75)",S(2));
    text(a.t,a.x,H-44,46,"#fff","400");
  }
}
function render(){
  clear();drawSky();
  ctx.save();
  if(shake>1)ctx.translate((Math.random()-.5)*S(shake),(Math.random()-.5)*S(shake));
  items.forEach(drawItem);drawTooth();
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.textLife)text(p.text,p.x,p.y,21,p.good?"#74ff9d":"#ff6c79","900");
    else{ctx.fillStyle=p.good?"#fff27a":"#ff5d75";ctx.beginPath();ctx.arc(X(p.x),Y(p.y),S(3.5),0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
  }
  ctx.restore();hud();arrows();
  if(state==="menu"||state==="gameover"||paused){
    ctx.fillStyle="rgba(0,15,55,.62)";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(state==="menu"){text("TOOTH SAVER",W/2,235,55);text("Catch toothbrushes & floss • Avoid candy & soda",W/2,280,20,"#dffbff","700");button("START GAME",W/2,355)}
    if(state==="gameover"){text("GAME OVER",W/2,245,58);text("Score: "+score,W/2,295,28);button("PLAY AGAIN",W/2,355)}
    if(paused&&state==="playing"){text("PAUSED",W/2,285,52);button("RESUME",W/2,355)}
  }
}
function button(t,x,y){
  roundedRect(X(x-110),Y(y-28),S(220),S(56),S(18),"#0d5dcc","#7be8ff",S(3));
  text(t,x,y,22);
}
function loop(now){
  const dt=Math.min(.035,(now-last)/1000||0);last=now;
  if(state==="playing"&&!paused)update(dt);
  render();requestAnimationFrame(loop);
}
function start(){score=0;lives=3;level=1;items=[];particles=[];spawnClock=0;tooth.x=tooth.targetX=W/2;tooth.y=H-68;state="playing";paused=false}
function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/(r.width)),y:(e.clientY-r.top)*(H/(r.height))};
}
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture?.(e.pointerId);
  const p=canvasPoint(e);
  if(state==="menu"){start();return}
  if(state==="gameover"){start();return}
  if(state==="playing"){
    if(p.x>1020&&p.y<85){paused=!paused;return}
    if(paused){if(p.x>440&&p.x<660&&p.y>320&&p.y<390)paused=false;return}
    tooth.targetX=Math.max(65,Math.min(W-65,p.x));
  }
});
canvas.addEventListener("pointermove",e=>{
  if(state==="playing"&&!paused) tooth.targetX=Math.max(55,Math.min(W-55,canvasPoint(e).x));
});
addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key===" "){if(state==="menu"||state==="gameover")start();else if(state==="playing")paused=!paused}
  if(e.key==="Escape"&&state==="playing")paused=!paused;
});
addEventListener("keyup",e=>keys[e.key]=false);
loop(performance.now());
</script>
</body>
</html>
